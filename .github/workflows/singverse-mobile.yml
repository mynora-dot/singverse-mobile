name: singverse-mobile
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: make check build
      - run: ./gradlew :app:assembleDebugAndroidTest
        working-directory: android
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/validate-release.py --platform mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build signed release
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
          KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          SINGVERSE_MOBILE_STORE_PASSWORD: ${{ secrets.MOBILE_STORE_PASSWORD }}
          SINGVERSE_MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          SINGVERSE_MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          export SINGVERSE_MOBILE_KEYSTORE="$RUNNER_TEMP/mobile-release.jks"
          trap 'rm -f "$SINGVERSE_MOBILE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SINGVERSE_MOBILE_KEYSTORE"
          chmod 600 "$SINGVERSE_MOBILE_KEYSTORE"
          make release
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          python3 scripts/validate-release.py --platform mobile --assets build/mobile-release --upload
