name: singverse-mobile
on:
  release:
    types: [published]
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
concurrency:
  group: singverse-mobile-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/validate-release.py --platform mobile
      - name: Set version from Release tag
        run: python3 scripts/build_version.py --github-env
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Limit Gradle memory and cache build outputs on the runner
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' \
            'org.gradle.workers.max=2' \
            'kotlin.daemon.jvmargs=-Xmx1g' \
            'org.gradle.caching=true' >> "$HOME/.gradle/gradle.properties"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build signed release
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
          KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          SINGVERSE_MOBILE_STORE_PASSWORD: ${{ secrets.MOBILE_STORE_PASSWORD }}
          SINGVERSE_MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          SINGVERSE_MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          export SINGVERSE_MOBILE_KEYSTORE="$RUNNER_TEMP/mobile-release.jks"
          trap 'rm -f "$SINGVERSE_MOBILE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SINGVERSE_MOBILE_KEYSTORE"
          chmod 600 "$SINGVERSE_MOBILE_KEYSTORE"
          make release
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          python3 scripts/validate-release.py --platform mobile --assets build/mobile-release --upload
